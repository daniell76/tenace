[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenace"
version = "0.1.0"
description = "Tenace: 3-Layer Neuro-Symbolic Contract Bridge AI"
requires-python = ">=3.12"
dependencies = [
    "open-spiel>=2.0.2",
    "pydantic>=2.9.0",
    "numpy>=2.0.0",
    "google-genai>=3.2.0",
    "google-cloud-aiplatform>=1.84.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
tenace-match = "tenace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tenace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:invalid escape sequence:SyntaxWarning:google\\.genai.*",
]
